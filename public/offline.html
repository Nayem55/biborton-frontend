<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Biborton Fashion World</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #F9F7F2 0%, #E8E6E1 100%);
        display: flex;
        align-items: center;
        justify-center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 500px;
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      }

      .icon {
        font-size: 80px;
        margin-bottom: 20px;
        opacity: 0.5;
      }

      h1 {
        font-size: 32px;
        color: #000;
        margin-bottom: 16px;
        font-weight: 300;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .button {
        display: inline-block;
        padding: 14px 32px;
        background: #000;
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        transition: all 0.3s ease;
      }

      .button:hover {
        background: #EE2B34;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(238, 43, 52, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Please check your
        network and try again.
      </p>
      <a href="/" class="button">Try Again</a>
    </div>
  </body>
</html>
